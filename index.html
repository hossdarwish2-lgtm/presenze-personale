<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenze Personale</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#1f2937;color:#fff;padding:12px 16px}
.header-inner{max-width:1050px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{order:2;margin:0;font-size:22px}
.header-upload{display:flex;order:2;align-items:center;gap:6px;background:#fff;color:#1f2937;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:bold;cursor:pointer}
.header-upload .upload-arrow{font-size:19px;line-height:1}
.header-upload input{display:none}
.header-reset{order:1;background:#fff;color:#1f2937;border:0;padding:7px 10px;border-radius:7px;font-size:19px;line-height:1;cursor:pointer}
.header-date{display:flex;order:3;align-items:center;gap:7px;font-size:12px;font-weight:bold}
.header-date input{padding:7px 8px;border:0;border-radius:7px;background:#fff;color:#1f2937}
main{max-width:1050px;margin:18px auto;padding:0 12px}
.toolbar,.counterbar{background:#fff;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
.toolbar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sync-status{font-size:12px;color:#6b7280}
.date-row{justify-content:space-between}
input[type=file]{max-width:100%}
input[type=date]{padding:8px;border:1px solid #d1d5db;border-radius:7px}
.reset-general{background:#dc2626;color:#fff;padding:8px 13px}
.reset-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:24px;line-height:1;font-weight:700}
.counterbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counter{border-radius:10px;padding:13px;text-align:center;background:#f3f4f6}
.counter strong{display:block;font-size:24px;margin-top:4px}
.counter small{font-size:12px}
.counter.fedex{background:#e0e7ff}
.counter.interinale{background:#fef3c7}
.counter.presenti{background:#dcfce7}
.person{background:#fff;border-radius:12px;margin-bottom:9px;padding:11px;box-shadow:0 2px 6px #00000010}
.mainrow{display:flex;align-items:center;gap:8px}
.name{flex:1;font-weight:bold;font-size:16px;cursor:pointer}
.name:hover{text-decoration:underline}
.type{width:92px;text-align:center;padding:6px;border-radius:6px;font-size:11px;font-weight:bold}
.type.fedex{background:#e0e7ff;color:#3730a3}
.type.interinale{background:#fef3c7;color:#92400e}
.buttons{display:flex;gap:7px}
button{border:0;border-radius:7px;padding:9px 11px;font-weight:bold;cursor:pointer}
.present{background:#e5e7eb;color:#374151}
.present.active{background:#22c55e;color:#fff}
.absent{background:#e5e7eb;color:#374151}
.absent.active{background:#eab308;color:#111}
.details{display:none;margin-top:10px;padding:11px;border-top:1px solid #e5e7eb;background:#f9fafb;border-radius:8px;font-size:14px}
.details.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.detail-item strong{display:block;font-size:11px;color:#6b7280;text-transform:uppercase;margin-bottom:3px}

.letter-filters{background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
.filter-title{font-size:12px;font-weight:bold;color:#6b7280;text-transform:uppercase;margin-bottom:6px}
.letter-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.letter-filter-row:last-child{margin-bottom:0}
.letter-position{min-width:82px;font-size:12px;font-weight:bold;color:#6b7280}
.letter-select{min-width:120px;padding:7px 9px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#1f2937;font-size:13px}
@media(max-width:430px){.letter-filter-row{display:grid;grid-template-columns:82px 1fr}.letter-select{width:100%}}
@media(max-width:750px){
 .header-inner{align-items:flex-start}
 .header-date{flex-direction:column;align-items:flex-end}
 .counterbar{grid-template-columns:1fr 1fr}
 .counter.presenti{grid-column:1/-1}
 .mainrow{flex-wrap:wrap}
 .name{flex-basis:100%;order:1}
 .buttons{order:2;width:100%;align-items:center}
 .buttons button{flex:1}
 .buttons .type{flex:0 0 auto}
 .detail-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div class="header-inner">
  <button class="header-reset" id="resetGeneral" title="Azzera presenze" aria-label="Azzera presenze">↻</button>
  <label class="header-upload" title="Carica file">
   <span class="upload-arrow">↑</span><span>Carica file</span>
   <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
  </label>
  <h1>Presenze Personale</h1>
  <div class="header-date">
   <span>DATA</span>
   <input type="date" id="attendanceDate">
  </div>
 </div>
</header>
<main>
<section class="toolbar"><div class="toolbar-row"><span class="sync-status" id="syncStatus">Database: collegamento attivo</span></div></section>
<section class="counterbar">
 <div class="counter fedex"><small>FEDEX PRESENTI</small><strong id="fedexCount">0</strong></div>
 <div class="counter interinale"><small>INTERINALI PRESENTI</small><strong id="interinaleCount">0</strong></div>
 <div class="counter presenti"><small>PRESENTI</small><strong id="presentiCount">0</strong></div>
</section>
<section class="letter-filters">
 <div class="filter-title">Cognome</div>
 <div class="letter-filter-row"><span class="letter-position">1ª lettera</span><select class="letter-select" id="surname1"></select></div>
 <div class="letter-filter-row"><span class="letter-position">2ª lettera</span><select class="letter-select" id="surname2"></select></div>
 <div class="letter-filter-row"><span class="letter-position">3ª lettera</span><select class="letter-select" id="surname3"></select></div>
 <div class="filter-title" style="margin-top:12px">Nome</div>
 <div class="letter-filter-row"><span class="letter-position">1ª lettera</span><select class="letter-select" id="name1"></select></div>
 <div class="letter-filter-row"><span class="letter-position">2ª lettera</span><select class="letter-select" id="name2"></select></div>
 <div class="letter-filter-row"><span class="letter-position">3ª lettera</span><select class="letter-select" id="name3"></select></div>
</section>

<section id="peopleList"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let people=[],openDetails={},surnameFilter=["","",""],nameFilter=["","",""];
const SUPABASE_URL="https://onxcpwqsupocoegqdsao.supabase.co";
const SUPABASE_KEY="sb_publishable_rnU8r1juOz0WyeA4YyJz9g_iAaFkHZU";
const SUPABASE_TABLE="presenze";
const SUPABASE_PERSONNEL_TABLE="personale";
let syncBusy=false;
const fileInput=document.getElementById("excelFile"),dateInput=document.getElementById("attendanceDate"),list=document.getElementById("peopleList");
dateInput.value=new Date().toISOString().slice(0,10);
createLetterFilters();
fileInput.addEventListener("change",handleFile);
dateInput.addEventListener("change",loadStatuses);
document.getElementById("resetGeneral").addEventListener("click",resetGeneral);
loadPersonnel();
function storageKey(){return "presenze_v3_"+dateInput.value}
async function resetGeneral(){
 if(!people.length)return;
 if(!confirm("Vuoi azzerare tutte le presenze per la data selezionata?"))return;
 try{
   const res=await supabaseFetch(`?attendance_date=eq.${encodeURIComponent(dateInput.value)}`,{method:"DELETE"});
   if(!res.ok) throw new Error(await res.text());
   localStorage.removeItem(storageKey());
   people.forEach(p=>p.status="neutro");
   render();
 }catch(err){console.error(err);alert("Errore nel reset delle presenze sul database.");}
}

function createLetterFilters(){
 const letters=["",..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
 ["surname1","surname2","surname3","name1","name2","name3"].forEach(id=>{
   const select=document.getElementById(id);
   select.innerHTML="";
   letters.forEach(letter=>{
     const opt=document.createElement("option");
     opt.value=letter;
     opt.textContent=letter || "Tutte";
     select.appendChild(opt);
   });
   select.addEventListener("change",()=>{
     surnameFilter=[document.getElementById("surname1").value,document.getElementById("surname2").value,document.getElementById("surname3").value];
     nameFilter=[document.getElementById("name1").value,document.getElementById("name2").value,document.getElementById("name3").value];
     render();
   });
 });
 surnameFilter=["","",""];
 nameFilter=["","",""];
}

function renderFilters(){
 const ids=["surname1","surname2","surname3","name1","name2","name3"];
 const values=[...surnameFilter,...nameFilter];
 ids.forEach((id,i)=>{document.getElementById(id).value=values[i]||"";});
}

async function handleFile(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=async function(ev){
  try{
   setSyncStatus("Importazione personale in corso…");
   const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});if(!rows.length)return;
   const h=rows[0].map(v=>String(v).trim().toLowerCase());
   const find=(names,fallback)=>{const i=h.findIndex(x=>names.includes(x));return i>=0?i:fallback};
   const cAgency=find(["agenzia"],0),cSurname=find(["cognome"],1),cName=find(["nome"],2),cArea=find(["area"],3),cStart=find(["start time","start"],4),cEnd=find(["end time","end"],5);
   const imported=rows.slice(1).map(r=>{
    const agency=String(r[cAgency]??"").trim(),surname=String(r[cSurname]??"").trim(),name=String(r[cName]??"").trim();
    if(!surname&&!name)return null;
    return {person_key:(surname+"|"+name).toLowerCase().trim(),cognome:surname,nome:name,agenzia:agency,type:agency.toLowerCase().replace(/\s+/g,"")==="fedex"?"FedEx":"Interinale",area:String(r[cArea]??"").trim(),start_time:formatTime(r[cStart]),end_time:formatTime(r[cEnd]),active:true,updated_at:new Date().toISOString()};
   }).filter(Boolean);
   if(!imported.length){throw new Error("Nessun nominativo trovato nel file.");}
   await replacePersonnel(imported);
   people=imported.map(x=>({id:x.person_key,surname:x.cognome,name:x.nome,agency:x.agenzia,type:x.type,area:x.area,start:x.start_time,end:x.end_time,status:"neutro"}));
   surnameFilter=["","",""]; nameFilter=["","",""]; renderFilters();
   setSyncStatus("Database: personale aggiornato");
   await loadStatuses();
  }catch(err){console.error(err);setSyncStatus("Errore database");alert("Errore nel caricamento del personale sul database.\n\n"+err.message);}
  fileInput.value="";
 };
 reader.readAsArrayBuffer(file);
}

async function loadPersonnel(){
 try{
  setSyncStatus("Caricamento personale…");
  const res=await supabasePersonnelFetch("?active=eq.true&select=person_key,cognome,nome,agenzia,type,area,start_time,end_time&order=cognome.asc,nome.asc");
  if(!res.ok) throw new Error(await res.text());
  const rows=await res.json();
  people=rows.map(x=>({id:x.person_key,surname:x.cognome||"",name:x.nome||"",agency:x.agenzia||"",type:x.type||"Interinale",area:x.area||"",start:x.start_time||"—",end:x.end_time||"—",status:"neutro"}));
  setSyncStatus(people.length?`Database: ${people.length} persone caricate`:`Database: nessun personale caricato`);
  await loadStatuses();
 }catch(err){
  console.error(err);people=[];render();setSyncStatus("Errore caricamento personale");
  alert("Non riesco a caricare il personale dal database. Controlla la tabella 'personale' e le policy RLS.");
 }
}

async function replacePersonnel(rows){
 // Mark the current roster inactive, then activate the new roster.
 // The same person can appear more than once in the Excel file;
 // keep only the last row for each person_key so the UPSERT never
 // sends duplicate keys in the same command.
 const uniqueRows = Array.from(new Map(rows.map(r => [r.person_key, r])).values());
 const off=await supabasePersonnelFetch("?person_key=not.is.null",{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({active:false,updated_at:new Date().toISOString()})});
 if(!off.ok) throw new Error(await off.text());
 const res=await supabasePersonnelFetch("?on_conflict=person_key",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(uniqueRows)});
 if(!res.ok) throw new Error(await res.text());
}

function supabasePersonnelFetch(path,options={}){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept-Profile":"public","Content-Profile":"public"},options.headers||{});
 return fetch(SUPABASE_URL+"/rest/v1/"+SUPABASE_PERSONNEL_TABLE+path,Object.assign({},options,{headers}));
}

function setSyncStatus(text){document.getElementById("syncStatus").textContent=text;}

function formatTime(v){
 if(v===""||v==null)return "—";
 if(typeof v==="number"){const t=Math.round(v*1440);return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
 return String(v);
}
async function loadStatuses(){
 if(!people.length){render();return;}
 people.forEach(p=>p.status="neutro");
 try{
   const res=await supabaseFetch(`?attendance_date=eq.${encodeURIComponent(dateInput.value)}&select=person_key,status`);
   if(!res.ok) throw new Error(await res.text());
   const rows=await res.json();
   const byKey={};
   rows.forEach(r=>{byKey[r.person_key]=r.status||"neutro"});
   people.forEach(p=>p.status=byKey[p.id]||"neutro");
   localStorage.setItem(storageKey(),JSON.stringify(byKey));
 }catch(err){
   console.error(err);
   try{const saved=JSON.parse(localStorage.getItem(storageKey())||"{}");people.forEach(p=>p.status=saved[p.id]||"neutro");}catch(e){}
   alert("Impossibile leggere le presenze dal database. Controlla le policy RLS di Supabase.");
 }
 render();
}
function saveLocal(){const d={};people.forEach(p=>d[p.id]=p.status);localStorage.setItem(storageKey(),JSON.stringify(d))}
async function setStatus(i,status){
 const p=people[i];
 const previous=p.status;
 const next=previous===status?"neutro":status;
 p.status=next;
 saveLocal();
 render();
 try{
   if(next==="neutro") await deleteStatus(p.id);
   else await upsertStatus(p.id,next);
   setSyncStatus("Database: presenza salvata");
 }catch(err){
   console.error(err);
   p.status=previous;
   saveLocal();
   render();
   alert("Errore nel salvataggio della presenza sul database.");
 }
}
function supabaseFetch(path,options={}){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept-Profile":"public","Content-Profile":"public"},options.headers||{});
 return fetch(SUPABASE_URL+"/rest/v1/"+SUPABASE_TABLE+path,Object.assign({},options,{headers}));
}
async function upsertStatus(personKey,status){
 const date=dateInput.value;
 const res=await supabaseFetch(`?on_conflict=attendance_date%2Cperson_key`,{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({attendance_date:date,person_key:personKey,status,updated_at:new Date().toISOString()})});
 if(!res.ok) throw new Error(await res.text());
}
async function deleteStatus(personKey){
 const date=dateInput.value;
 const res=await supabaseFetch(`?attendance_date=eq.${encodeURIComponent(date)}&person_key=eq.${encodeURIComponent(personKey)}`,{method:"DELETE"});
 if(!res.ok) throw new Error(await res.text());
}
function toggleDetails(i){openDetails[i]=!openDetails[i];render()}
function render(){
 list.innerHTML="";let fp=0,ip=0,pres=0;
 people.forEach(p=>{if(p.status==="presente"){pres++;if(p.type==="FedEx")fp++;else ip++}});
 document.getElementById("fedexCount").textContent=fp;
 document.getElementById("interinaleCount").textContent=ip;
 document.getElementById("presentiCount").textContent=pres;
 if(!people.length){list.innerHTML="<div class=\"person\"><div style=\"text-align:center;padding:20px;color:#6b7280\">Nessun personale caricato. Usa ↑ Carica file.</div></div>";return;}
 const visiblePeople=people.map((p,i)=>({p,i})).filter(({p})=>{
  const surnameLetters=getLetters(p.surname);
  const nameLetters=getLetters(p.name);
  const surnameOk=surnameFilter.every((f,idx)=>!f || surnameLetters[idx]===f);
  const nameOk=nameFilter.every((f,idx)=>!f || nameLetters[idx]===f);
  return surnameOk && nameOk;
 });

 visiblePeople.forEach(({p,i})=>{
  const row=document.createElement("div");row.className="person";
  const main=document.createElement("div");main.className="mainrow";
  const name=document.createElement("div");name.className="name";name.textContent=p.surname+" "+p.name;name.onclick=()=>toggleDetails(i);
  const buttons=document.createElement("div");buttons.className="buttons";
  const type=document.createElement("div");type.className="type "+(p.type==="FedEx"?"fedex":"interinale");type.textContent=p.type;buttons.appendChild(type);
  [["Presente","present","presente"],["Assente","absent","assente"]].forEach(x=>{const b=document.createElement("button");b.textContent=x[0];b.className=x[1]+(p.status===x[2]?" active":"");b.onclick=()=>setStatus(i,x[2]);buttons.appendChild(b)});
  main.append(name,buttons);row.appendChild(main);
  const details=document.createElement("div");details.className="details"+(openDetails[i]?" open":"");
  details.innerHTML=`<div class="detail-grid"><div class="detail-item"><strong>Agenzia</strong>${escapeHtml(p.agency||"—")}</div><div class="detail-item"><strong>Area</strong>${escapeHtml(p.area||"—")}</div><div class="detail-item"><strong>Start Time</strong>${escapeHtml(p.start)}</div><div class="detail-item"><strong>End Time</strong>${escapeHtml(p.end)}</div></div>`;
  row.appendChild(details);list.appendChild(row);
 });
}
function getLetters(value){
 const s=String(value ?? "").trim();
 if(!s) return ["","",""];
 const normalized=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
 const letters=(normalized.match(/[A-Z]/g)||[]).slice(0,3);
 return [letters[0]||"",letters[1]||"",letters[2]||""];
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
